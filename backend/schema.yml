      properties:
        tanggal:
          type: string
          format: date
        no_bukti:
          type: string
          maxLength: 100
        nominal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        akun_kas:
          type: string
          maxLength: 20
        request_id:
          type: string
          format: uuid
        alokasi:
          type: array
          items:
            $ref: '#/components/schemas/AlokasiPembayaranInput'
      required:
      - akun_kas
      - alokasi
      - no_bukti
      - nominal
      - request_id
      - tanggal
    BayarTagihanResponse:
      type: object
      properties:
