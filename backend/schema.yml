components:
  schemas:
    AbsenPegawai:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tanggal:
          type: string
          format: date
        hadir:
          type: integer
          maximum: 2147483647
          minimum: 0
        izin:
          type: integer
          maximum: 2147483647
          minimum: 0
        sakit:
          type: integer
          maximum: 2147483647
          minimum: 0
        terlambat:
          type: integer
          maximum: 2147483647
          minimum: 0
        pegawai:
          type: integer
      required:
      - id
      - pegawai
      - tanggal
    AlokasiPembayaranInput:
      type: object
      properties:
        detail:
          type: integer
          minimum: 1
        nominal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - detail
      - nominal
    AlokasiPembayaranTagihan:
      type: object
      properties:
        detail:
          type: integer
        nominal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - detail
      - nominal
    ArmadaJemputan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nama_supir:
          type: string
          maxLength: 100
        jenis_mobil:
          type: string
          maxLength: 50
        kapasitas:
          type: integer
          maximum: 2147483647
          minimum: 0
        keterangan:
          type: string
          maxLength: 255
      required:
      - id
      - nama_supir
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        table_name:
          type: string
        row_pk:
          type: string
          nullable: true
        action:
          type: string
          maxLength: 10
        old_data:
          nullable: true
        new_data:
          nullable: true
        changed_by:
          type: integer
          nullable: true
        changed_by_username:
          type: string
          readOnly: true
        changed_at:
          type: string
          format: date-time
      required:
      - action
      - changed_at
      - changed_by_username
      - id
      - table_name
    BatalPenerimaanInput:
      type: object
      properties:
        alasan:
          type: string
          maxLength: 500
      required:
      - alasan
    BayarPendaftaranInput:
      type: object
      properties:
        komponen:
          type: array
          items:
            $ref: '#/components/schemas/BayarPendaftaranInputKomponenEnum'
        tanggal:
          type: string
          format: date
        no_bukti:
          type: string
          maxLength: 50
        nominal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        akun_kas:
          type: string
          maxLength: 20
      required:
      - akun_kas
      - komponen
      - no_bukti
      - nominal
      - tanggal
    BayarPendaftaranInputKomponenEnum:
      enum:
      - SITIN
      - FORMULIR
      type: string
      description: |-
        * `SITIN` - SITIN
        * `FORMULIR` - FORMULIR
    BayarPendaftaranResponse:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
        jurnal_id:
          type: string
          format: uuid
          readOnly: true
        pendaftaran:
          allOf:
          - $ref: '#/components/schemas/PendaftaranSiswa'
          readOnly: true
      required:
      - detail
      - jurnal_id
      - pendaftaran
    BayarTagihanInput:
      type: object
      properties:
        tanggal:
          type: string
          format: date
        no_bukti:
          type: string
          maxLength: 100
        nominal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        akun_kas:
          type: string
          maxLength: 20
        request_id:
          type: string
          format: uuid
        alokasi:
          type: array
          items:
            $ref: '#/components/schemas/AlokasiPembayaranInput'
      required:
      - akun_kas
      - alokasi
      - no_bukti
      - nominal
      - request_id
      - tanggal
    BayarTagihanResponse:
      type: object
      properties:
        detail:
          type: string
        tagihan:
          $ref: '#/components/schemas/Tagihan'
        pembayaran:
          $ref: '#/components/schemas/PembayaranTagihan'
        jurnal_id:
          type: string
          format: uuid
      required:
      - detail
      - jurnal_id
      - pembayaran
      - tagihan
    BiayaMasukDefault:
      type: object
      properties:
        uang_masuk:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
