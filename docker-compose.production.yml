name: beesmartfinance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_lebah_madu
      POSTGRES_USER: beesmartfinance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U beesmartfinance -d db_lebah_madu"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.production
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.vps}
      DJANGO_ALLOWED_HOSTS: ${API_HOST:?Set API_HOST in .env.vps}
      DJANGO_CORS_ORIGINS: https://beesmartfinance-skripsi.ansinar2003.workers.dev
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${API_HOST},https://beesmartfinance-skripsi.ansinar2003.workers.dev
      DJANGO_HTTPS: "true"
      DB_NAME: db_lebah_madu
      DB_USER: beesmartfinance
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    networks: [web, database]
    depends_on:
      db: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - staticfiles:/srv/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  web:
  database:
    internal: true

volumes:
  pgdata:
  media:
  staticfiles:
  caddy_data:
  caddy_config:
