name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_lebah_madu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_lebah_madu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install .

      - name: Run Django tests
        working-directory: backend
        env:
          DB_NAME: db_lebah_madu
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: "true"
          DJANGO_ENV: development
        run: python manage.py test --parallel

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          for file in docker-compose.production.yml scripts/deploy_vps.sh frontend/wrangler.jsonc frontend/worker/index.js; do
            test -f "$file" || { echo "Missing deployment file: $file" >&2; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for production
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build

      - name: Configure VPS connection
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/vps_known_hosts"
          chmod 600 "$RUNNER_TEMP/vps_key" "$RUNNER_TEMP/vps_known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/vps_key" > /dev/null

      - name: Deploy backend to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          git ls-files -z -- backend docker database/schemas database/raw_data/coa.csv database/raw_data/T_AKUN.csv database/raw_data/T_GOLKUN.csv database/raw_data/T_SUBGOL.csv pyproject.toml uv.lock README.md docker-compose.production.yml scripts/deploy_vps.sh |
            tar --null -T - -czf - |
            ssh -i "$RUNNER_TEMP/vps_key" -o UserKnownHostsFile="$RUNNER_TEMP/vps_known_hosts" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/beesmartfinance && cd /opt/beesmartfinance && tar -xzf - && sh scripts/deploy_vps.sh'
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null https://srv2054916.hstgr.cloud/api/schema/

      - name: Deploy frontend to Cloudflare Worker
        working-directory: frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --keep-vars
